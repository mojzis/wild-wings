name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: wild-wings-prototype/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./wild-wings-prototype

      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests
        working-directory: ./wild-wings-prototype

      - name: Build
        run: npm run build
        working-directory: ./wild-wings-prototype
